name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep every push verdict, but cancel superseded pull-request runs.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Test the inherited minimum from ChargyCore, the newest supported Node
    # release, and Windows on the LTS version in between.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.18.0'
            leg: ubuntu-node-22.18
          - os: ubuntu-latest
            node: '26'
            leg: ubuntu-node-26
          - os: windows-latest
            node: '24'
            leg: windows-node-24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run test:typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=artifacts/tests-${{ matrix.leg }}.xml

      - name: Build production application
        run: npm run build:production

      - name: Install Chromium for documentation screenshots
        if: ${{ matrix.leg == 'ubuntu-node-26' }}
        run: npx playwright install --with-deps chromium

      - name: Capture current TrustAnchor documentation screenshots
        if: ${{ matrix.leg == 'ubuntu-node-26' }}
        run: npm run docs:screenshots:capture -- --output-dir artifacts/documentation-screenshots

      - name: Upload documentation screenshots
        if: ${{ matrix.leg == 'ubuntu-node-26' && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: trust-anchor-documentation-screenshots
          path: artifacts/documentation-screenshots/
          if-no-files-found: error

      - name: Validate POI session documentation examples
        if: ${{ matrix.leg == 'ubuntu-node-26' }}
        run: npm run docs:validate:poi-live

      - name: Capture session and live-link documentation screenshots
        if: ${{ matrix.leg == 'ubuntu-node-26' }}
        run: npm run docs:screenshots:poi-live:capture -- --output-dir artifacts/poi-live-screenshots

      - name: Upload session and live-link documentation screenshots
        if: ${{ matrix.leg == 'ubuntu-node-26' && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: poi-live-use-case-documentation-screenshots
          path: artifacts/poi-live-screenshots/
          if-no-files-found: error

      - name: Check station proof UI and capture documentation screenshots
        if: ${{ matrix.leg == 'ubuntu-node-26' }}
        run: npm run docs:screenshots:station-proof:capture -- --output-dir artifacts/station-proof-screenshots

      - name: Upload station proof documentation screenshots
        if: ${{ matrix.leg == 'ubuntu-node-26' && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: station-proof-documentation-screenshots
          path: artifacts/station-proof-screenshots/
          if-no-files-found: error

      - name: Check completed session Drag & Drop and capture screenshots
        if: ${{ matrix.leg == 'ubuntu-node-26' }}
        run: npm run docs:screenshots:poi-session:capture -- --output-dir artifacts/poi-session-screenshots

      - name: Upload completed POI session screenshots
        if: ${{ matrix.leg == 'ubuntu-node-26' && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: poi-completed-session-screenshots
          path: artifacts/poi-session-screenshots/
          if-no-files-found: error

      - name: Check historical POI sessions and archive UX
        if: ${{ matrix.leg == 'ubuntu-node-26' }}
        run: npm run docs:screenshots:poi-history:capture -- --output-dir artifacts/poi-history-screenshots

      - name: Upload historical POI screenshots
        if: ${{ matrix.leg == 'ubuntu-node-26' && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: poi-history-screenshots
          path: artifacts/poi-history-screenshots/
          if-no-files-found: error

      - name: Check session price evidence and capture screenshots
        if: ${{ matrix.leg == 'ubuntu-node-26' }}
        run: npm run docs:screenshots:poi-prices:capture -- --output-dir artifacts/poi-price-screenshots

      - name: Upload session price screenshots
        if: ${{ matrix.leg == 'ubuntu-node-26' && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: poi-price-screenshots
          path: artifacts/poi-price-screenshots/
          if-no-files-found: error

      - name: Check complete POI live pilot
        if: ${{ matrix.leg == 'ubuntu-node-26' }}
        run: npm run docs:screenshots:poi-live-pilot:capture -- --output-dir artifacts/poi-live-pilot-screenshots

      - name: Upload POI live pilot screenshots
        if: ${{ matrix.leg == 'ubuntu-node-26' && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: poi-live-pilot-screenshots
          path: artifacts/poi-live-pilot-screenshots/
          if-no-files-found: error

      - name: Check durable observed versions and recovery UX
        if: ${{ matrix.leg == 'ubuntu-node-26' }}
        run: npm run docs:screenshots:poi-observations:capture -- --output-dir artifacts/poi-observed-versions-screenshots

      - name: Upload observed-version screenshots
        if: ${{ matrix.leg == 'ubuntu-node-26' && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: poi-observed-versions-screenshots
          path: artifacts/poi-observed-versions-screenshots/
          if-no-files-found: error

      - name: Check CPO authority and trust succession
        if: ${{ matrix.leg == 'ubuntu-node-26' }}
        run: npm run docs:screenshots:poi-succession:capture -- --output-dir artifacts/poi-trust-succession-screenshots

      - name: Upload trust-succession screenshots
        if: ${{ matrix.leg == 'ubuntu-node-26' && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: poi-trust-succession-screenshots
          path: artifacts/poi-trust-succession-screenshots/
          if-no-files-found: error

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.leg }}
          path: artifacts/*.xml
          if-no-files-found: ignore

      - name: Upload production build
        if: ${{ matrix.leg == 'ubuntu-node-26' && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: chargy-webapp
          path: build/
          if-no-files-found: error

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep every push verdict, but cancel superseded pull-request runs.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Test the inherited minimum from ChargyCore, the newest supported Node
    # release, and Windows on the LTS version in between.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.13'
            leg: ubuntu-node-22.13
          - os: ubuntu-latest
            node: '26'
            leg: ubuntu-node-26
          - os: windows-latest
            node: '24'
            leg: windows-node-24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run test:typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=artifacts/tests-${{ matrix.leg }}.xml

      - name: Build production application
        run: npm run build:production

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.leg }}
          path: artifacts/*.xml
          if-no-files-found: ignore

      - name: Upload production build
        if: ${{ matrix.leg == 'ubuntu-node-26' && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: chargy-webapp
          path: build/
          if-no-files-found: error

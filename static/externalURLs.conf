# Allowed external URL prefixes.
#
# Two things fetch URLs that come from outside this installation: the "verifyURL"
# deep link parameter, and the https transports of a charge transparency live
# link, which are asked again while the charging session they describe is still
# running.
#
# A URL starting with one of the prefixes below is fetched without asking
# anyone. A live transport URL that matches no prefix usually goes to the USER
# instead - once per origin, remembered, revocable (trust on first use) - with
# two exceptions that need no dialog: a URL on the installation's own origin is
# always allowed, and a URL that fails the structural rules (not https, or a
# private-network/loopback host on a public deployment) is refused outright and
# never offered. So to enable a LAN or non-https live transport, list it here;
# the dialog will not offer it on its own. The verifyURL deep link knows no
# dialog at all and always requires a prefix here.
#
# The browser's Content-Security-Policy has to allow the host as well: see
# "connect-src" in index.html. A prefix listed here but missing there is refused
# by the browser rather than by Chargy.
#
# Reload mode (optional, default "open"):
#   mode open     A live transport origin that no prefix covers is offered to
#                 the user (trust on first use), as described above.
#   mode strict   Such an origin is never offered and never polled - only the
#                 prefixes below and the app's own origin are reloaded, and no
#                 trust dialog ever appears. A self-hosting operator that lists
#                 its own servers here wants this, so its drivers are never
#                 asked a question they cannot judge. Remember to list every
#                 server your documents point at; an unlisted one then simply
#                 does not reload (a console message says so), with no dialog to
#                 reveal it. Only affects live-link reloading, not verifyURL.
#
# Format: [mode open|strict] and <URL-prefix> <max-payload-size-in-kbytes> lines
# Example:
# mode strict
# https://api.example.org/ctrs/ 100
